<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <h1>Comedores Estudiantiles</h1>

    <!-- Menú compartido,favor copiar este bloque en todas las páginas -->
    <div id="menu">
        <a href="beneficiarios.html">Beneficiarios</a>
        <a href="menus.html">Menús</a>
        <a href="inventario.html">Inventario</a>
        <a href="compras.html">Compras</a>
        <a href="raciones.html">Raciones servidas</a>
        <a href="reportes.html">Reportes</a>
        <a href="login.html">Cerrar sesión</a>
    </div>

    <!--Alertas de stock bajo y productos por vencer -->
    <div class="tarjeta tarjeta-ancha">
        <h2>Alertas de inventario</h2>
        <ul id="lista-alertas"></ul>
    </div>

    <!-- Registro de entradas y salidas -->
    <div class="tarjeta">
        <h2>Registrar movimiento</h2>

        <label>Producto</label>
        <br>
        <select id="producto"></select>
        <br>

        <label>Tipo de movimiento</label>
        <br>
        <select id="tipo">
            <option value="">Seleccione una opción</option>
            <option value="Entrada">Entrada</option>
            <option value="Salida">Salida</option>
        </select>
        <br>

        <label>Cantidad</label>
        <br>
        <input type="number" id="cantidad" min="0" step="0.01">
        <br>

        <label>Fecha de vencimiento </label>
        <br>
        <input type="date" id="vencimiento">
        <br>

        <button onclick="registrarMovimiento()">Registrar</button>

        <p id="mensaje" class="mensaje"></p>
    </div>

    <!--Existencias -->
    <div class="tarjeta tarjeta-ancha">
        <h2>Existencias</h2>
        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad actual</th>
                        <th>Stock mínimo</th>
                        <th>Vencimiento</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-inventario"></tbody>
            </table>
        </div>
    </div>

    <!-- Ultimos movimientos -->
    <div class="tarjeta tarjeta-ancha">
        <h2>Últimos movimientos</h2>
        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Producto</th>
                        <th>Tipo</th>
                        <th>Cantidad</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-movimientos"></tbody>
            </table>
        </div>
    </div>

    <script src="datos-ejemplo.js"></script>
    <script src="inventario.js"></script>
</body>

</html>
